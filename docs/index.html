<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>London Fountain Map</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
  href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap"
  rel="stylesheet"
/>

<style>

:root{
  --blue:#0ea5e9;
  --blue-dark:#0f4c81;

  --green:#16a34a;
  --red:#ef4444;
  --grey:#94a3b8;

  --bg:#f0f9ff;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  height:100%;
}

body{
  font-family:'DM Sans',sans-serif;
  overflow:hidden;

  background:
    radial-gradient(circle at top left,#dbeafe 0%,transparent 30%),
    radial-gradient(circle at bottom right,#bfdbfe 0%,transparent 30%),
    var(--bg);
}

/* HEADER */

header{
  background:
    linear-gradient(
      135deg,
      #0f4c81 0%,
      #0ea5e9 100%
    );

  color:white;

  padding:16px 18px;

  box-shadow:
    0 8px 20px rgba(0,0,0,.12);

  position:relative;
  z-index:1000;
}

.logo{
  font-family:'Fredoka',sans-serif;
  font-size:1.6rem;
  font-weight:700;
}

.subtitle{
  margin-top:2px;
  opacity:.92;
  font-size:.8rem;
}

/* INFO */

.info-bar{
  background:rgba(255,255,255,.82);

  backdrop-filter:blur(10px);

  padding:10px 14px;

  text-align:center;

  font-size:.78rem;

  border-bottom:
    1px solid rgba(255,255,255,.6);
}

.info-bar a{
  color:var(--blue-dark);
  font-weight:700;
}

/* LAYOUT */

.layout{
  display:flex;
  height:calc(100vh - 104px);
}

/* SIDEBAR */

.sidebar{
  width:340px;
  min-width:300px;

  background:rgba(255,255,255,.82);

  backdrop-filter:blur(14px);

  border-right:
    1px solid rgba(255,255,255,.5);

  overflow:hidden;

  display:flex;
  flex-direction:column;
}

.sidebar-top{
  padding:16px;
}

.search{
  width:100%;

  padding:12px 14px;

  border:none;
  outline:none;

  border-radius:16px;

  background:white;

  font-size:.92rem;
}

.filters{
  display:flex;
  gap:8px;

  margin-top:12px;
}

.filters button{
  flex:1;

  border:none;

  border-radius:12px;

  padding:10px;

  cursor:pointer;

  font-family:inherit;
  font-weight:700;
  font-size:.72rem;

  background:white;

  transition:.15s;
}

.filters button:hover{
  transform:translateY(-1px);
}

.filters .active{
  background:#dbeafe;
  color:#0f4c81;
}

.stats{
  display:flex;
  gap:10px;

  padding:0 16px 14px;
}

.stat{
  flex:1;

  background:white;

  border-radius:14px;

  text-align:center;

  padding:10px;
}

.stat strong{
  display:block;

  font-size:1.2rem;

  font-family:'Fredoka',sans-serif;
}

.list{
  flex:1;

  overflow-y:auto;

  padding:0 10px 10px;
}

.item{
  display:flex;
  align-items:center;
  gap:10px;

  background:white;

  border-radius:16px;

  padding:12px 14px;

  margin-bottom:10px;

  cursor:pointer;

  transition:.16s;
}

.item:hover{
  transform:translateY(-2px);

  box-shadow:
    0 10px 18px rgba(14,165,233,.10);
}

.item-name{
  flex:1;

  font-size:.9rem;
  font-weight:600;
}

.badge{
  border-radius:999px;

  padding:5px 9px;

  font-size:.68rem;
  font-weight:700;
}

.badge-open{
  background:#dcfce7;
  color:#166534;
}

.badge-closed{
  background:#fee2e2;
  color:#991b1b;
}

.badge-unknown{
  background:#e2e8f0;
  color:#475569;
}

/* MAP */

.map-wrap{
  flex:1;
  position:relative;
}

#map{
  width:100%;
  height:100%;
}

/* IMPORTANT */

.leaflet-container{
  background:#dbeafe;
}

.note{
  position:absolute;

  left:10px;
  bottom:10px;

  z-index:1000;

  background:rgba(255,255,255,.82);

  backdrop-filter:blur(10px);

  border-radius:999px;

  padding:5px 10px;

  font-size:.68rem;

  opacity:.8;
}

/* MARKERS */

.pin{
  width:38px;
  height:38px;
}

.pin svg{
  width:100%;
  height:100%;

  filter:
    drop-shadow(0 4px 8px rgba(0,0,0,.24));
}

/* MOBILE */

@media (max-width:700px){

  html,
  body{
    overflow:auto;
    height:auto;
  }

  .layout{
    flex-direction:column;
    height:auto;
  }

  .map-wrap{
    order:1;

    height:58vh;
    min-height:420px;
  }

  .sidebar{
    order:2;

    width:100%;
    min-width:100%;

    border-radius:24px 24px 0 0;

    margin-top:-16px;
  }

  .list{
    overflow:visible;
  }
}

</style>
</head>

<body>

<header>

  <div class="logo">
    💧 London Fountain Map
  </div>

  <div class="subtitle">
    Live splash pad status
  </div>

</header>

<div class="info-bar">

  <span id="updated">
    Loading fountain data...
  </span>

  •

  Data from
  <a
    href="https://bablands.com/fountainwatch/"
    target="_blank"
  >
    bablands.com
  </a>

</div>

<div class="layout">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="sidebar-top">

      <input
        id="search"
        class="search"
        type="search"
        placeholder="Search fountains..."
      >

      <div class="filters">

        <button class="active" data-filter="all">
          All
        </button>

        <button data-filter="on">
          ✓ Open
        </button>

        <button data-filter="off">
          ✕ Closed
        </button>

        <button data-filter="unknown">
          – No data
        </button>

      </div>

    </div>

    <div class="stats">

      <div class="stat">
        <strong id="open-count">0</strong>
        Open
      </div>

      <div class="stat">
        <strong id="closed-count">0</strong>
        Closed
      </div>

      <div class="stat">
        <strong id="unknown-count">0</strong>
        No data
      </div>

    </div>

    <div
      class="list"
      id="list"
    ></div>

  </aside>

  <!-- MAP -->

  <div class="map-wrap">

    <div id="map"></div>

    <div class="note">
      📍 Locations approximate
    </div>

  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map;
let fountains = [];
let markers = {};
let currentFilter = 'all';

/* INIT MAP */

function initMap(){

  map = L.map('map',{
    center:[51.505,-0.09],
    zoom:11
  });

  /* OPENFREEMAP BRIGHT */

  L.tileLayer(
    'https://tiles.openfreemap.org/styles/bright/{z}/{x}/{y}.png',
    {
      attribution:
        '&copy; OpenStreetMap contributors &copy; OpenFreeMap',
      maxZoom:20
    }
  ).addTo(map);

  setTimeout(()=>{
    map.invalidateSize();
  },300);
}

/* MARKER SVG */

function markerSVG(status){

  let color = '#94a3b8';
  let symbol = '–';

  if(status === 'on'){
    color = '#16a34a';
    symbol = '✓';
  }

  if(status === 'off'){
    color = '#ef4444';
    symbol = '✕';
  }

  return `
    <div class="pin">

      <svg viewBox="0 0 64 64">

        <path
          d="M32 2C19 2 8 13 8 26c0 18 24 36 24 36s24-18 24-36C56 13 45 2 32 2z"
          fill="${color}"
        />

        <circle
          cx="32"
          cy="26"
          r="16"
          fill="white"
        />

        <text
          x="32"
          y="34"
          text-anchor="middle"
          font-size="24"
          font-family="Arial"
          font-weight="bold"
          fill="${color}"
        >
          ${symbol}
        </text>

      </svg>

    </div>
  `;
}

/* ICON */

function makeIcon(status){

  return L.divIcon({
    className:'',
    html:markerSVG(status),
    iconSize:[38,38],
    iconAnchor:[19,38],
    popupAnchor:[0,-30]
  });
}

/* RENDER MAP */

function renderMarkers(){

  Object.values(markers).forEach(
    m => map.removeLayer(m)
  );

  markers = {};

  fountains.forEach(f => {

    if(
      currentFilter !== 'all' &&
      f.status !== currentFilter
    ){
      return;
    }

    const marker = L.marker(
      [Number(f.lat), Number(f.lon)],
      {
        icon:makeIcon(f.status)
      }
    )
    .addTo(map)
    .bindTooltip(
      f.name,
      {
        direction:'top',
        offset:[0,-20]
      }
    )
    .bindPopup(`
      <strong>${f.name}</strong>
      <br><br>
      Status:
      ${
        f.status === 'on'
          ? '✓ Open'
          : f.status === 'off'
            ? '✕ Closed'
            : '– No data'
      }
    `);

    markers[f.name] = marker;
  });
}

/* RENDER LIST */

function renderList(){

  const search =
    document
      .getElementById('search')
      .value
      .toLowerCase();

  const list =
    document.getElementById('list');

  const filtered =
    fountains.filter(f => {

      if(
        currentFilter !== 'all' &&
        f.status !== currentFilter
      ){
        return false;
      }

      return f.name
        .toLowerCase()
        .includes(search);
    });

  list.innerHTML =
    filtered.map(f => {

      const badge =
        f.status === 'on'
          ? 'badge-open'
          : f.status === 'off'
            ? 'badge-closed'
            : 'badge-unknown';

      const label =
        f.status === 'on'
          ? 'Open'
          : f.status === 'off'
            ? 'Closed'
            : 'No data';

      return `
        <div
          class="item"
          onclick="zoomToFountain('${f.name.replace(/'/g,"\\'")}')"
        >

          <div class="item-name">
            ${f.name}
          </div>

          <div class="badge ${badge}">
            ${label}
          </div>

        </div>
      `;

    }).join('');
}

/* ZOOM */

function zoomToFountain(name){

  const f =
    fountains.find(
      x => x.name === name
    );

  if(!f) return;

  map.flyTo(
    [Number(f.lat), Number(f.lon)],
    17,
    {
      duration:1
    }
  );

  setTimeout(()=>{

    if(markers[name]){
      markers[name].openPopup();
    }

  },700);
}

/* STATS */

function updateStats(){

  document.getElementById(
    'open-count'
  ).textContent =
    fountains.filter(
      f => f.status === 'on'
    ).length;

  document.getElementById(
    'closed-count'
  ).textContent =
    fountains.filter(
      f => f.status === 'off'
    ).length;

  document.getElementById(
    'unknown-count'
  ).textContent =
    fountains.filter(
      f => f.status === 'unknown'
    ).length;
}

/* LOAD DATA */

async function loadData(){

  try{

    const res =
      await fetch(
        'data.json?_=' + Date.now()
      );

    const data =
      await res.json();

    fountains =
      (data.fountains || []).map(f => ({
        ...f,
        status:f.status || 'unknown'
      }));

    renderMarkers();
    renderList();
    updateStats();

    document.getElementById(
      'updated'
    ).textContent =
      data.updated_at
        ? 'Updated ' +
          new Date(
            data.updated_at
          ).toLocaleString('en-GB')
        : 'Live data loaded';

  }catch(err){

    console.error(err);

    document.getElementById(
      'updated'
    ).textContent =
      'Could not load data';
  }
}

/* FILTER BUTTONS */

document.addEventListener(
  'click',
  e => {

    if(
      e.target.matches(
        '.filters button'
      )
    ){

      document
        .querySelectorAll(
          '.filters button'
        )
        .forEach(
          b => b.classList.remove('active')
        );

      e.target.classList.add(
        'active'
      );

      currentFilter =
        e.target.dataset.filter;

      renderMarkers();
      renderList();
    }
  }
);

/* SEARCH */

document
  .getElementById('search')
  .addEventListener(
    'input',
    renderList
  );

/* MOBILE FIX */

window.addEventListener(
  'resize',
  ()=>{
    setTimeout(()=>{
      map.invalidateSize();
    },300);
  }
);

initMap();
loadData();

</script>

</body>
</html>
