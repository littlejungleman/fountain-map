<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<script data-goatcounter="https://littlejungleman.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<title>London Fountain Map</title>

<!-- LEAFLET -->

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- MAPLIBRE -->

<link
  href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
  rel="stylesheet"
/>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<!-- LEAFLET + MAPLIBRE -->

<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>

<!-- FONTS -->

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
  href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap"
  rel="stylesheet"
/>

<style>

:root{
  --blue:#0ea5e9;
  --blue-dark:#0f4c81;

  --green:#16a34a;
  --red:#ef4444;
  --grey:#94a3b8;

  --bg:#f0f9ff;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  height:100%;
}

body{
  font-family:'DM Sans',sans-serif;
  overflow:hidden;
  background:var(--bg);
}

/* HEADER */

header{
  background:
    linear-gradient(
      135deg,
      #0f4c81 0%,
      #0ea5e9 100%
    );

  color:white;

  padding:16px 18px;

  box-shadow:
    0 6px 16px rgba(0,0,0,.12);

  position:relative;
  z-index:1000;
}

.logo{
  font-family:'Fredoka',sans-serif;
  font-size:1.7rem;
  font-weight:700;
}

.subtitle{
  margin-top:2px;
  opacity:.92;
  font-size:.9rem;
}

/* INFO BAR */

.info-bar{
  background:white;

  padding:12px 14px;

  text-align:center;

  font-size:.82rem;

  border-bottom:
    1px solid #e2e8f0;
}

.info-bar a{
  color:#0f4c81;
  font-weight:700;
}

/* LAYOUT */

.layout{
  display:flex;
  height:calc(100vh - 110px);
}

/* SIDEBAR */

.sidebar{
  width:360px;
  min-width:320px;

  background:
    rgba(255,255,255,.96);

  border-right:
    1px solid #e2e8f0;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}

.sidebar-top{
  padding:16px;
}

.search{
  width:100%;

  border:none;
  outline:none;

  background:#f1f5f9;

  border-radius:18px;

  padding:14px 16px;

  font-size:1rem;
}

.filters{
  display:flex;
  gap:10px;

  margin-top:14px;
}

.filters button{
  flex:1;

  border:none;

  border-radius:14px;

  padding:12px;

  cursor:pointer;

  font-size:.82rem;
  font-weight:700;

  background:#f1f5f9;

  transition:.15s;
}

.filters button.active{
  background:#dbeafe;
  color:#0f4c81;
}

.filters button:hover{
  transform:translateY(-1px);
}

.stats{
  display:flex;
  gap:10px;

  padding:0 16px 16px;
}

.stat{
  flex:1;

  background:white;

  border:
    1px solid #dbe3ef;

  border-radius:16px;

  padding:12px;

  text-align:center;
}

.stat strong{
  display:block;

  font-family:'Fredoka',sans-serif;
  font-size:1.4rem;
}

/* LIST */

.list{
  flex:1;
  overflow-y:auto;

  padding:0 10px 12px;
}

.item{
  display:flex;
  align-items:center;
  gap:12px;

  background:white;

  border:
    1px solid #e2e8f0;

  border-radius:18px;

  padding:14px;

  margin-bottom:10px;

  cursor:pointer;

  transition:.15s;
}

.item:hover{
  transform:translateY(-2px);

  box-shadow:
    0 8px 18px rgba(14,165,233,.12);
}

.item-name{
  flex:1;

  font-size:.95rem;
  font-weight:600;
}

.badge{
  border-radius:999px;

  padding:6px 10px;

  font-size:.72rem;
  font-weight:700;
}

.badge-open{
  background:#dcfce7;
  color:#166534;
}

.badge-closed{
  background:#fee2e2;
  color:#991b1b;
}

.badge-unknown{
  background:#e2e8f0;
  color:#475569;
}

/* MAP */

.map-wrap{
  flex:1;
  position:relative;
  min-height:300px;
}

#map{
  width:100%;
  height:100%;
}

.note{
  position:absolute;

  left:12px;
  bottom:12px;

  z-index:1000;

  background:
    rgba(255,255,255,.9);

  padding:7px 12px;

  border-radius:999px;

  font-size:.72rem;

  box-shadow:
    0 4px 12px rgba(0,0,0,.08);
}

/* POPUP */

.popup-title{
  font-weight:700;
  margin-bottom:8px;
}

.popup-status{
  margin-bottom:8px;
}

.popup-updated{
  font-size:.8rem;
  color:#64748b;
}

/* MARKERS */

.pin{
  width:40px;
  height:40px;
}

.pin svg{
  width:100%;
  height:100%;

  filter:
    drop-shadow(0 4px 8px rgba(0,0,0,.25));
}

/* MOBILE */

@media (max-width:700px){

  html,
  body{
    height:auto;
    overflow:auto;
  }

  body{
    overflow-x:hidden;
  }

  .layout{
    flex-direction:column;
    height:auto;
    min-height:100vh;
  }

  .map-wrap{
    order:1;

    width:100%;
    height:55vh;
    min-height:420px;

    flex:none;
  }

  #map{
    height:100%;
    min-height:420px;
  }

  .sidebar{
    order:2;

    width:100%;
    min-width:100%;

    border-radius:24px 24px 0 0;

    margin-top:-18px;

    position:relative;
    z-index:1000;
  }

  .list{
    overflow:visible;
  }
}

</style>
</head>

<body>

<header>

  <div class="logo">
    💧 London Fountain Map
  </div>

  <div class="subtitle">
    Live splash pad status
  </div>

</header>

<div class="info-bar">

  <span id="updated">
    Loading fountain data...
  </span>

  •

  Data from

  <a
    href="https://bablands.com/fountainwatch-live/"
    target="_blank"
  >
    bablands.com
  </a>

  •

  Submit an update 

  <a
    href="https://bablands.com/fountainwatch/"
    target="_blank"
  >
    here
  </a>
</div>

<div class="layout">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="sidebar-top">

      <input
        id="search"
        class="search"
        type="search"
        placeholder="Search fountains..."
      >

      <div class="filters">

        <button
          class="active"
          data-filter="all"
        >
          All
        </button>

        <button data-filter="on">
          ✓ Open
        </button>

        <button data-filter="off">
          ✕ Closed
        </button>

        <button data-filter="unknown">
          – No data
        </button>

      </div>

    </div>

    <div class="stats">

      <div class="stat">
        <strong id="open-count">0</strong>
        Open
      </div>

      <div class="stat">
        <strong id="closed-count">0</strong>
        Closed
      </div>

      <div class="stat">
        <strong id="unknown-count">0</strong>
        No data
      </div>

    </div>

    <div
      class="list"
      id="list"
    ></div>

  </aside>

  <!-- MAP -->

  <div class="map-wrap">

    <div id="map"></div>

    <div class="note">
      📍 Locations approximate
    </div>

  </div>

</div>

<script>

let map;
let fountains = [];
let markers = {};
let currentFilter = 'all';

/* INIT MAP */

function initMap(){

  map = L.map('map',{
    center:[51.505,-0.09],
    zoom:11
  });

  L.maplibreGL({
    style:
      'https://tiles.openfreemap.org/styles/bright'
  }).addTo(map);

  setTimeout(()=>{
    map.invalidateSize();
  },700);
}

/* SORT ORDER */

function statusOrder(status){

  if(status === 'on') return 1;
  if(status === 'off') return 2;
  return 3;
}

/* MARKER SVG */

function markerSVG(status){

  let color = '#94a3b8';
  let symbol = '–';

  if(status === 'on'){
    color = '#16a34a';
    symbol = '✓';
  }

  if(status === 'off'){
    color = '#ef4444';
    symbol = '✕';
  }

  return `
    <div class="pin">

      <svg viewBox="0 0 64 64">

        <path
          d="M32 2C19 2 8 13 8 26c0 18 24 36 24 36s24-18 24-36C56 13 45 2 32 2z"
          fill="${color}"
        />

        <circle
          cx="32"
          cy="26"
          r="16"
          fill="white"
        />

        <text
          x="32"
          y="34"
          text-anchor="middle"
          font-size="24"
          font-family="Arial"
          font-weight="bold"
          fill="${color}"
        >
          ${symbol}
        </text>

      </svg>

    </div>
  `;
}

/* ICON */

function makeIcon(status){

  return L.divIcon({
    className:'',
    html:markerSVG(status),
    iconSize:[40,40],
    iconAnchor:[20,40],
    popupAnchor:[0,-32]
  });
}

/* RENDER MARKERS */

function renderMarkers(){

  Object.values(markers).forEach(
    marker => map.removeLayer(marker)
  );

  markers = {};

  fountains.forEach(f => {

    if(
      currentFilter !== 'all' &&
      f.status !== currentFilter
    ){
      return;
    }

    const marker = L.marker(
      [Number(f.lat), Number(f.lon)],
      {
        icon:makeIcon(f.status)
      }
    )
    .addTo(map)
    .bindTooltip(
      f.name,
      {
        direction:'top',
        offset:[0,-20]
      }
    )
    .bindPopup(`
  <div class="popup-title">
    ${f.name}
  </div>

  <div class="popup-status">
    ${
      f.status === 'on'
        ? '✓ Open'
        : f.status === 'off'
          ? '✕ Closed'
          : '– No data'
    }
  </div>

  ${
    f.reported_at
      ? `
        <div class="popup-updated">
          Last updated:
          ${f.reported_at}
        </div>
      `
      : ''
  }
`);

    markers[f.name] = marker;
  });
}

/* RENDER LIST */

function renderList(){

  const search =
    document
      .getElementById('search')
      .value
      .toLowerCase();

  const list =
    document.getElementById('list');

  const filtered =
    fountains
      .filter(f => {

        if(
          currentFilter !== 'all' &&
          f.status !== currentFilter
        ){
          return false;
        }

        return f.name
          .toLowerCase()
          .includes(search);
      })
      .sort((a,b)=>{

        const orderDiff =
          statusOrder(a.status) -
          statusOrder(b.status);

        if(orderDiff !== 0){
          return orderDiff;
        }

        return a.name.localeCompare(b.name);
      });

  list.innerHTML =
    filtered.map(f => {

      const badge =
        f.status === 'on'
          ? 'badge-open'
          : f.status === 'off'
            ? 'badge-closed'
            : 'badge-unknown';

      const label =
        f.status === 'on'
          ? 'Open'
          : f.status === 'off'
            ? 'Closed'
            : 'No data';

      return `
        <div
          class="item"
          onclick="zoomToFountain('${f.name.replace(/'/g,"\\'")}')"
        >

          <div class="item-name">
            ${f.name}
          </div>

          <div class="badge ${badge}">
            ${label}
          </div>

        </div>
      `;

    }).join('');
}

/* ZOOM */

function zoomToFountain(name){

  const f =
    fountains.find(
      x => x.name === name
    );

  if(!f) return;

  map.flyTo(
    [Number(f.lat), Number(f.lon)],
    17,
    {
      duration:1
    }
  );

  setTimeout(()=>{

    if(markers[name]){
      markers[name].openPopup();
    }

  },700);
}

/* STATS */

function updateStats(){

  document.getElementById(
    'open-count'
  ).textContent =
    fountains.filter(
      f => f.status === 'on'
    ).length;

  document.getElementById(
    'closed-count'
  ).textContent =
    fountains.filter(
      f => f.status === 'off'
    ).length;

  document.getElementById(
    'unknown-count'
  ).textContent =
    fountains.filter(
      f => f.status === 'unknown'
    ).length;
}

/* LOAD DATA */

async function loadData(){

  try{

    const res =
      await fetch(
        'data.json?_=' + Date.now()
      );

    const data =
      await res.json();

    fountains =
      (data.fountains || []).map(f => ({
        ...f,
        status:f.status || 'unknown'
      }));

    renderMarkers();
    renderList();
    updateStats();

    document.getElementById("updated-time").textContent =
  `Updated ${data.updated_at}`;

    /* IMPORTANT MOBILE FIX */

    setTimeout(()=>{
      map.invalidateSize();
    },1000);

  }catch(err){

    console.error(err);

    document.getElementById(
      'updated'
    ).textContent =
      'Could not load data';
  }
}

/* FILTER BUTTONS */

document.addEventListener(
  'click',
  e => {

    if(
      e.target.matches(
        '.filters button'
      )
    ){

      document
        .querySelectorAll(
          '.filters button'
        )
        .forEach(
          b => b.classList.remove('active')
        );

      e.target.classList.add(
        'active'
      );

      currentFilter =
        e.target.dataset.filter;

      renderMarkers();
      renderList();
    }
  }
);

/* SEARCH */

document
  .getElementById('search')
  .addEventListener(
    'input',
    renderList
  );

/* MOBILE FIXES */

window.addEventListener(
  'load',
  ()=>{
    setTimeout(()=>{
      map.invalidateSize();
    },1200);
  }
);

window.addEventListener(
  'resize',
  ()=>{
    setTimeout(()=>{
      map.invalidateSize();
    },700);
  }
);

window.addEventListener(
  'orientationchange',
  ()=>{
    setTimeout(()=>{
      map.invalidateSize();
    },1000);
  }
);

/* START */

initMap();
loadData();

</script>

</body>
</html>
